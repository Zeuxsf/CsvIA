<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesclar CSV e Excel</title>
<style>
:root {
  --bg: #eef1f0;
  --panel: #ffffff;
  --ink: #17262b;
  --muted: #5b6b70;
  --line: #cbd5d3;
  --accent: #0f5c6e;
  --accent-dark: #0b4655;
  --danger: #a33a2a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
main {
  max-width: 880px;
  margin: 0 auto;
  padding: 40px 20px 64px;
  display: grid;
  gap: 20px;
}
h1 { margin: 0 0 4px; font-size: 1.75rem; letter-spacing: -0.01em; }
h2 { margin: 0 0 12px; font-size: 1.05rem; }
header p { margin: 0; color: var(--muted); }
section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
}
.hidden { display: none; }
.drop {
  display: block;
  border: 2px dashed var(--line);
  border-radius: 6px;
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  color: var(--muted);
}
.drop strong { color: var(--ink); }
.drop.over, .drop:focus-within { border-color: var(--accent); background: #f3f8f9; }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
}
li .name { font-weight: 600; word-break: break-all; }
li .meta { color: var(--muted); font-size: 0.875rem; }
button {
  font: inherit;
  cursor: pointer;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  padding: 8px 14px;
}
button:hover { border-color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
button.primary:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
button.remove { color: var(--danger); padding: 4px 10px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #7fb7c4; outline-offset: 2px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > span, legend { font-weight: 600; font-size: 0.9rem; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: flex-start; }
.choice input { margin-top: 5px; }
.choice small { display: block; color: var(--muted); }
select {
  font: inherit;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  max-width: 100%;
}
.notice { color: var(--danger); margin: 0 0 12px; }
.summary { margin: 0 0 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: #f3f6f5; position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mesclar planilhas CSV e Excel</h1>
    <p>Os arquivos são processados no seu navegador e não são enviados a nenhum servidor.</p>
  </header>

  <section>
    <h2>Arquivos</h2>
    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,text/csv" multiple>
      <strong>Escolha os arquivos CSV ou Excel (.xlsx, .xls)</strong> ou arraste-os para cá
    </label>
    <ul id="fileList" class="hidden" style="margin-top:16px"></ul>
  </section>

  <section id="optionsSection" class="hidden">
    <h2>Como mesclar</h2>
    <fieldset>
      <legend>Tipo de mesclagem</legend>
      <label class="choice">
        <input type="radio" name="mode" value="stack" checked>
        <span>Empilhar linhas<small>Junta todas as linhas em uma só planilha. Colunas diferentes entre os arquivos são unidas.</small></span>
      </label>
      <label class="choice">
        <input type="radio" name="mode" value="join">
        <span>Combinar por coluna-chave<small>Junta as linhas que têm o mesmo valor na coluna escolhida, somando as colunas de cada arquivo.</small></span>
      </label>
    </fieldset>

    <div id="joinOptions" class="hidden">
      <p class="notice hidden" id="keyNotice">Não há uma coluna com o mesmo nome em todos os arquivos.</p>
      <label class="field">
        <span>Coluna-chave</span>
        <select id="keySelect"></select>
      </label>
      <label class="field">
        <span>Linhas mantidas</span>
        <select id="joinType">
          <option value="full">Todas as linhas de todos os arquivos</option>
          <option value="inner">Somente linhas presentes em todos os arquivos</option>
        </select>
      </label>
    </div>

    <label class="field">
      <span>Formato do arquivo final</span>
      <select id="outFormat">
        <option value="auto">Igual ao do primeiro arquivo</option>
        <option value="csv">CSV</option>
        <option value="xlsx">Excel (.xlsx)</option>
      </select>
    </label>

    <label class="field" id="delimField" style="margin-bottom:0">
      <span>Separador do arquivo final</span>
      <select id="outDelim">
        <option value="auto">Igual ao do primeiro CSV</option>
        <option value=";">Ponto e vírgula (;)</option>
        <option value=",">Vírgula (,)</option>
        <option value="&#9;">Tabulação</option>
      </select>
    </label>
  </section>

  <section id="resultSection" class="hidden">
    <h2>Resultado</h2>
    <p class="summary" id="summary"></p>
    <div class="table-wrap"><table id="preview"></table></div>
    <button class="primary" id="download">Baixar mesclado.csv</button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const state = { files: [], result: null };

const el = id => document.getElementById(id);
const fileInput = el('fileInput');
const drop = el('drop');
const fileList = el('fileList');
const optionsSection = el('optionsSection');
const resultSection = el('resultSection');
const joinOptions = el('joinOptions');
const keySelect = el('keySelect');
const keyNotice = el('keyNotice');
const joinType = el('joinType');
const outDelim = el('outDelim');
const outFormat = el('outFormat');
const delimField = el('delimField');
const summary = el('summary');
const preview = el('preview');
const downloadBtn = el('download');

function decode(buffer) {
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
  } catch (e) {
    return new TextDecoder('windows-1252').decode(buffer);
  }
}

function detectDelimiter(text) {
  const firstLine = text.replace(/^\uFEFF/, '').split(/\r?\n/)[0] || '';
  const candidates = [';', ',', '\t', '|'];
  let best = ',';
  let bestCount = 0;
  for (const d of candidates) {
    const count = firstLine.split(d).length - 1;
    if (count > bestCount) { best = d; bestCount = count; }
  }
  return best;
}

function parse(text, d) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [];
  let field = '';
  let quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else field += c;
    } else if (c === '"') {
      quoted = true;
    } else if (c === d) {
      row.push(field);
      field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field);
      rows.push(row);
      row = [];
      field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

function uniqueHeaders(raw) {
  const seen = new Map();
  return raw.map((h, i) => {
    let name = h.trim() || 'coluna ' + (i + 1);
    const n = (seen.get(name) || 0) + 1;
    seen.set(name, n);
    return n > 1 ? name + '_' + n : name;
  });
}

function buildEntry(name, table, delim, kind) {
  if (!table.length) return null;
  const headers = uniqueHeaders(table[0].map(String));
  const rows = table.slice(1).map(cells => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = cells[i] !== undefined ? cells[i] : ''; });
    return obj;
  });
  return { name, headers, rows, delim, kind };
}

function sheetToTable(ws) {
  if (!ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const table = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    const row = [];
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if (!cell) row.push('');
      else if (cell.t === 'n' && !(cell.z && XLSX.SSF.is_date(cell.z))) row.push(cell.v);
      else row.push(cell.w !== undefined ? cell.w : String(cell.v));
    }
    if (row.some(v => v !== '')) table.push(row);
  }
  return table;
}

async function readFile(file) {
  if (/\.csv$/i.test(file.name) || file.type === 'text/csv') {
    const text = decode(await file.arrayBuffer());
    const delim = detectDelimiter(text);
    const entry = buildEntry(file.name, parse(text, delim), delim, 'csv');
    return entry ? [entry] : [];
  }
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const multiple = wb.SheetNames.length > 1;
  const entries = [];
  wb.SheetNames.forEach(sheetName => {
    const name = multiple ? file.name + ' (' + sheetName + ')' : file.name;
    const entry = buildEntry(name, sheetToTable(wb.Sheets[sheetName]), null, 'xlsx');
    if (entry) entries.push(entry);
  });
  return entries;
}

async function addFiles(list) {
  for (const file of Array.from(list)) {
    if (!/\.(csv|xlsx|xls)$/i.test(file.name) && file.type !== 'text/csv') continue;
    try {
      const entries = await readFile(file);
      entries.forEach(e => state.files.push(e));
    } catch (e) {
      alert('Não foi possível ler o arquivo ' + file.name + '.');
    }
  }
  fileInput.value = '';
  refresh();
}

function delimiterName(d) {
  return { ';': 'ponto e vírgula', ',': 'vírgula', '\t': 'tabulação', '|': 'barra vertical' }[d];
}

function renderFiles() {
  fileList.innerHTML = '';
  fileList.classList.toggle('hidden', !state.files.length);
  state.files.forEach((f, index) => {
    const li = document.createElement('li');
    const info = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = f.name;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = f.rows.length + ' linhas, ' + f.headers.length + ' colunas, ' + (f.delim ? 'separador ' + delimiterName(f.delim) : 'planilha Excel');
    info.append(name, meta);
    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.textContent = 'Remover';
    remove.addEventListener('click', () => {
      state.files.splice(index, 1);
      refresh();
    });
    li.append(info, remove);
    fileList.append(li);
  });
}

function commonColumns() {
  if (!state.files.length) return [];
  return state.files[0].headers.filter(h => state.files.every(f => f.headers.includes(h)));
}

function renderKeyOptions() {
  const previous = keySelect.value;
  const columns = commonColumns();
  keySelect.innerHTML = '';
  columns.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    keySelect.append(opt);
  });
  if (columns.includes(previous)) keySelect.value = previous;
  keyNotice.classList.toggle('hidden', columns.length > 0);
  keySelect.disabled = !columns.length;
}

function stack() {
  const headers = [];
  const seen = new Set();
  state.files.forEach(f => f.headers.forEach(h => {
    if (!seen.has(h)) { seen.add(h); headers.push(h); }
  }));
  const rows = [];
  state.files.forEach(f => f.rows.forEach(r => {
    const obj = {};
    headers.forEach(h => { obj[h] = r[h] !== undefined ? r[h] : ''; });
    rows.push(obj);
  }));
  return { headers, rows };
}

function keyOf(row, key) {
  return String(row[key] === undefined ? '' : row[key]).trim();
}

function join(key, type) {
  const first = state.files[0];
  let headers = first.headers.slice();
  let rows = first.rows.map(r => Object.assign({}, r));
  for (const f of state.files.slice(1)) {
    const suffix = f.name.replace(/\.(csv|xlsx|xls)/i, '');
    const rename = {};
    const addedHeaders = [];
    f.headers.forEach(h => {
      if (h === key) { rename[h] = h; return; }
      const finalName = headers.includes(h) ? h + ' (' + suffix + ')' : h;
      rename[h] = finalName;
      addedHeaders.push(finalName);
    });
    const renamedRows = f.rows.map(r => {
      const obj = {};
      f.headers.forEach(h => { obj[rename[h]] = r[h]; });
      return obj;
    });
    const index = new Map();
    renamedRows.forEach(r => {
      const k = keyOf(r, key);
      if (!index.has(k)) index.set(k, []);
      index.get(k).push(r);
    });
    const matched = new Set();
    const out = [];
    rows.forEach(r => {
      const matches = index.get(keyOf(r, key));
      if (matches) {
        matches.forEach(m => {
          out.push(Object.assign({}, r, m));
          matched.add(m);
        });
      } else if (type === 'full') {
        out.push(Object.assign({}, r));
      }
    });
    if (type === 'full') {
      renamedRows.forEach(r => {
        if (!matched.has(r)) out.push(Object.assign({}, r));
      });
    }
    headers = headers.concat(addedHeaders);
    rows = out.map(r => {
      const obj = {};
      headers.forEach(h => { obj[h] = r[h] !== undefined ? r[h] : ''; });
      return obj;
    });
  }
  return { headers, rows };
}

function currentMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function outputFormat() {
  return outFormat.value === 'auto' ? state.files[0].kind : outFormat.value;
}

function outputDelimiter() {
  if (outDelim.value !== 'auto') return outDelim.value;
  const withDelim = state.files.find(f => f.delim);
  return withDelim ? withDelim.delim : ';';
}

function updateOutputControls() {
  const format = outputFormat();
  delimField.classList.toggle('hidden', format !== 'csv');
  downloadBtn.textContent = 'Baixar mesclado.' + format;
}

function compute() {
  if (state.files.length < 2) return null;
  if (currentMode() === 'stack') return stack();
  if (!keySelect.value) return null;
  return join(keySelect.value, joinType.value);
}

function renderResult() {
  state.result = compute();
  resultSection.classList.toggle('hidden', !state.result);
  if (!state.result) return;
  const { headers, rows } = state.result;
  summary.textContent = rows.length + ' linhas e ' + headers.length + ' colunas. Mostrando as primeiras ' + Math.min(10, rows.length) + ' linhas.';
  preview.innerHTML = '';
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    hr.append(th);
  });
  thead.append(hr);
  const tbody = document.createElement('tbody');
  rows.slice(0, 10).forEach(r => {
    const tr = document.createElement('tr');
    headers.forEach(h => {
      const td = document.createElement('td');
      td.textContent = r[h];
      tr.append(td);
    });
    tbody.append(tr);
  });
  preview.append(thead, tbody);
}

function refresh() {
  renderFiles();
  const hasFiles = state.files.length > 0;
  optionsSection.classList.toggle('hidden', !hasFiles);
  joinOptions.classList.toggle('hidden', currentMode() !== 'join');
  renderKeyOptions();
  if (hasFiles) updateOutputControls();
  renderResult();
}

function escapeCell(value, d) {
  const s = String(value === undefined ? '' : value);
  if (s.includes('"') || s.includes('\n') || s.includes('\r') || s.includes(d)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function toCSV(headers, rows, d) {
  const lines = [headers.map(h => escapeCell(h, d)).join(d)];
  rows.forEach(r => lines.push(headers.map(h => escapeCell(r[h], d)).join(d)));
  return lines.join('\r\n');
}

downloadBtn.addEventListener('click', () => {
  if (!state.result) return;
  if (outputFormat() === 'xlsx') {
    const { headers, rows } = state.result;
    const aoa = [headers].concat(rows.map(r => headers.map(h => r[h])));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Mesclado');
    XLSX.writeFile(wb, 'mesclado.xlsx');
    return;
  }
  const csv = '\uFEFF' + toCSV(state.result.headers, state.result.rows, outputDelimiter());
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mesclado.csv';
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

fileInput.addEventListener('change', () => addFiles(fileInput.files));

['dragenter', 'dragover'].forEach(type => drop.addEventListener(type, e => {
  e.preventDefault();
  drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(type => drop.addEventListener(type, e => {
  e.preventDefault();
  drop.classList.remove('over');
}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', refresh));
keySelect.addEventListener('change', renderResult);
joinType.addEventListener('change', renderResult);
outDelim.addEventListener('change', renderResult);
outFormat.addEventListener('change', updateOutputControls);

refresh();
</script>
</body>
</html>
